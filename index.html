<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="中心机柜动力环监一体化系统" />
    <title>中心机柜动力环监一体化系统</title>
    <script>
      try {
        var m = localStorage.getItem('pem.theme');
        if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m;
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #0a111e; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f2f5f9; }
      .boot { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #c9d4e5; }
      html[data-theme='light'] .boot { color: #1f2a3d; }
      .boot-logo { width: 56px; height: 56px; border-radius: 14px; background: #fff; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
      .boot-logo img { width: 40px; height: 40px; object-fit: contain; }
      .boot-title { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
      .boot-sub { font-size: 12px; opacity: .6; }
      .boot-bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(148,163,184,.2); overflow: hidden; }
      .boot-bar span { display: block; width: 40%; height: 100%; background: linear-gradient(90deg,#3e8bff,#22c3d6); border-radius: 3px; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-logo"><img src="/src/assets/logo.png" alt="明点信科" width="40" height="40" /></div>
        <div class="boot-title">中心机柜动力环监一体化系统</div>
        <div class="boot-bar"><span></span></div>
        <div class="boot-sub">正在建立采集链路…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
